# Linux port CI: builds the Avalonia frontend and runs the Core test suite.
name: Linux

on:
  push:
    branches: [ feature/linuxport ]
  pull_request:
    branches: [ feature/linuxport ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PKHeX.Avalonia/PKHeX.Avalonia.csproj

      - name: Build (Debug, warnings as errors)
        run: dotnet build PKHeX.Avalonia/PKHeX.Avalonia.csproj -c Debug --no-restore

      - name: Build (Release)
        run: dotnet build PKHeX.Avalonia/PKHeX.Avalonia.csproj -c Release --no-restore

      - name: Core tests
        run: dotnet test Tests/PKHeX.Core.Tests/PKHeX.Core.Tests.csproj -c Release

      # The AppImage is the deliverable: the script runs the self-contained publish itself.
      # appimagetool is fetched by the script and runs with --appimage-extract-and-run, so the runner needs no FUSE.
      - name: Publish and build the AppImage
        run: PKHeX.Avalonia/Packaging/build-appimage.sh --download-tool publish/appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v5
        with:
          name: PKHeX-x86_64.AppImage
          path: publish/appimage/PKHeX-x86_64.AppImage
          if-no-files-found: error
